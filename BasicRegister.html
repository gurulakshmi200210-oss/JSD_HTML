<html>
    <head>
        <title>BasicRegister</title>
    </head>
    <body>
        <h1>BasicRegister</h1>
        <form>
        <table border="1" cellpadding="2" height="300" width="100" bgcolor="lightgrey">
            <tr>
                <th>Name</th>
                <td><input type="text"></td>
            </tr>
            <tr>
                <th>Education Qualification</th>
                <td>
                    <input type="checkbox">UG
                    <input type="checkbox">PG
                    <input type="checkbox">Phd            
                </td>
            </tr>
            <tr>
                <th>Gender</th>
                <td>
                    <input type="radio">Female
                    <input type="radio">Male 
                </td>
            </tr>
            <tr>
                <th>D.O.B</th>
                <td>
                    <input type="date">
                </td>
            </tr>
            <tr>
                <th>Age</th>
                <td>
                    <input type="number">
                </td>
            </tr>
            <tr>
                <th>Resume</th>
                <td>
                    <input type="file">
                </td>
            </tr>
            <tr>
                <th><input type="Reset" value="Clear"></th>
                <td><input type="Submit" value="Register"></td>
            </tr>
        </table>
        </form>
    </body>
</html>
