<html>
    <head>

    <body>
        <h1>Login Page</h1>
        <nav>
        <a href="demotestRegistrationform.html">HomePage</a>
        <a href="demotestRegistrationform.html">RegisterForm</a>
        
        <a href="demotestLoginForm.html">Login Form</a>
        </nav>
        <br>
        <form method="" action="">
            <table border="1" cellpadding="5" bgcolor="litlegrey">
                <tr>
                    <td>
                        <strong>User ID</strong>
                    </td>
                    <td>
                        <input type="text">
                    </td>
                </tr>
                <tr>
                    <td>
                        <strong>Password</strong>
                    </td>
                    <td>
                        <input type="password">
                    </td>
                </tr>
                <tr>
                    <td>
                        <strong>Member</strong>
                    </td>
                    <td>

                            <option>Select</option>

                            <option>Teacher</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td colspan="2"><input type="checkbox">I Accept the terms and conditions</td>
                </tr>
                <tr>
                    <td>
                        <input type="reset">
                    </td>
                    <td><input type="submit"></td>
                </tr>
                <tr>
                    <td colspan="2"><a href="DemotestForgetPassword.html">Forget Password</a></td>
                </tr>
                <tr>
                    <td colspan="2"><input type="checkbox">Don't have a Account? Create a New Account</td>
                </tr>

            </table>

        </form>
