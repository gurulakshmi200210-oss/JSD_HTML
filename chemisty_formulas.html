<html>
    <head>
        <title>Chemistry Formulas</title>
    </head>
    <body>
        <h3>Some of chemistry formulas</h3>
        <table border="1px" cellpadding="5px" height="100" width="100" >
            <tr>
                <th>Name</th>
                <th>Formulas</th>
            </tr>
            <tr>
                <td>Calcium Carbonate</td>
                <td>C<sub>a</sub>CO<sub>3</sub></td>
            </tr>
            <tr>
                <td>Sodium hydrogen carbonate(bicarbonate)</td>
                <td>N<sub>a</sub>HCO<sub>3</sub></td>
            </tr>
            <tr>
                <td>Ammonia</td>
                <td>NH<sub>3</sub></td>
            </tr>
        </table>  
    </body>
</html>
