<html>
    <head>
        <title> Position3</title>
        <style>
            #one{
                background-color: rgb(13, 13, 109);
                height: 100px;
                width: 100px;
                position: relative;
                z-index: 1;
            }
            #two{
                background-color: rgb(156, 64, 7);
                height: 100px;
                width: 100px;
                position: absolute;
                top: 50px;
                left: 50px;
                z-index: 0;
                
            }
           
        </style>
    </head>
    <body>
        <div id="one"></div>
        <div id="two"></div>
       
    </body>
</html>
