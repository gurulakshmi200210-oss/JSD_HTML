<html>
    <head>
        <title>Transition</title>
        <style>
            #mi{
                border: 1px solid red;
                transition: 3s;
            }
            #zii{
                background-color: cyan;
            }
            #mi:hover{
                border: 1px solid black;
                background-color: aquamarine;
            }
            #zii:hover{
                background-color: cornsilk;
            }
        </style>
    </head>
    <body>
        <h3>Transition</h3>
        <div id="que">
            <button id="mi">Me</button>
            <button id="zii">you</button>
        </div>
    </body>
</html>
