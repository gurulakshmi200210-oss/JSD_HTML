    <script>
        let a=Number(prompt("Enter the A's no"));
        let b=Number(prompt("Enter the B's no"));
        let c=Number(prompt("Enter the C's no"));

        if (c==1) {
            document.write(a+b);
        }
        else if (c==2) {
            document.write(a-b);
        }
        else if (c==3) {
            document.write(a*b);
        }
        else if (c==4) {
            document.write(a/b);  
        }
        else {
            document.write("invaid");
        }
        document.write("</br>");
